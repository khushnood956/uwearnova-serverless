[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uwearnova-backend"
version = "0.1.0"
description = "UWEARNOVA Fashion E-Commerce Backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "UWEARNOVA Engineering", email = "engineering@uwearnova.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "aiomysql>=0.2.0",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
